<!doctype html><html><head><meta charset="utf-8">
    <title>My Favourite Movies</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto&display=swap" rel="stylesheet">
    <style>
        body { --primary: #E50914 ; --secondary: #29b6f6; margin: 0px;}
        * {font-family: 'Roboto', sans-serif;}
        button {
            -webkit-font-smoothing: antialiased;
            display: inline-block;
            text-decoration: none;
            margin: 2px;
            color: var(--primary);
            background: white;
            border: 1px solid var(--primary);
            height: 20px;
            font-size: 9px;
            text-transform: uppercase;
            cursor: pointer;
            transition: ease-in 0.2s all;
            padding: 0 8px 0 8px;
        }
        div#main {padding: 10px;}
        input {margin-bottom: 5px; margin-top: 2px; padding: 4px; font-size: 12px; }
        h1 {background: var(--primary); color: white; font-weight: bold; text-transform: uppercase; font-size: 20px; margin: 0px; padding: 15px;}
        h2 { margin-block-start: 0px; margin-block-end: 10px; font-size: 20px;  color: var(--primary);}
        button:hover { background: var(--primary); color: white; }
        div.actions { margin-top: 10px;}
        div.movie {display: inline-block; width: auto; padding: 10px; box-shadow: 2px 2px 7px #ccc; margin: 5px;}
        div.movie div.movie-img {width: 200px; height: auto; min-height: 200px; cursor: pointer;}
        div.movie div.movie-img img {width: 100%; height: 200px; object-fit: cover;}
        div.movie div.title {text-align: center; overflow: hidden; text-overflow: ellipsis; width: 200px; white-space: nowrap; }
        div.field {color: var(--primary); text-transform: uppercase; font-size: 12px;}
        /* Netflix 2.0 and 3.0 */
        button:disabled {opacity: 0.5;}
        p.message {color: red; font-size: 14px;}
        p.status {color: var(--primary); font-size: 14px;}
        div.result {display: inline-block; vertical-align: top; width: 200px; padding: 10px; box-shadow: 2px 2px 7px #ccc; margin: 5px;}
        div.result img {width: 100%;}
        div.result p {font-size: 12px;}
        ul.keyword-list li {margin-bottom: 5px;}
    </style>

    <!-- TMDb API token is stored in a separate configuration file (see config.example.js) -->
    <script type="text/javascript" src="config.js"></script>

    <script type="text/javascript">

       // DATA MODEL

       let initial_movies = [
        { title: "Superlópez", director: "Javier Ruiz Caldera", thumbnail: "files/superlopez.png" },
        { title: "Jurassic Park", director: "Steven Spielberg", thumbnail: "files/jurassicpark.png" },
        { title: "Interstellar", director: "Christopher Nolan", thumbnail: "files/interstellar.png" }
    ];


        localStorage.my_movies = localStorage.my_movies || JSON.stringify(initial_movies);

        // NETFLIX 2.0: TMDb API
        const TMDB_API_URL = "https://api.themoviedb.org/3";
        const TMDB_IMG_URL = "https://image.tmdb.org/t/p/w500";
        let search_results = [];   // results of the last search

        // NETFLIX 3.0: custom keyword list, saved in localStorage
        localStorage.my_keywords = localStorage.my_keywords || JSON.stringify([]);


        // VIEWS

        const indexView = (movies) => {
            let i=0;
            let view = "";

            while(i < movies.length) {
              view += `
                <div class="movie">
                   <div class="movie-img">
                        <img data-my-id="${i}" src="${movies[i].thumbnail}" onerror="this.src='files/noimage.png'"/>
                   </div>
                   <div class="title">
                       ${movies[i].title || "<em>No title</em>"}
                   </div>
                   <div class="actions">
                        <!-------------------Insert here "Show" and "Delete" buttons------------------>
                       <button class="show" data-my-id="${i}">view</button>
                       <button class="edit" data-my-id="${i}">edit</button>
                       <button class="delete" data-my-id="${i}">delete</button>
                    </div>
                </div>\n`;
              i = i + 1;
            };

            view += `<div class="actions">
                        <!-----------------------Insert here "Add" and "Reset" buttons---------------->
                        <button class="new">add</button>
                        <button class="reset">reset</button>
                        <button class="open-search">search TMDb</button>
                        <button class="my-keywords">my keywords</button>
                    </div>`;

            return view;
        };


        const editView = (i, movie) => {
            return `<h2>Edit Movie </h2>
                <div class="field">
                Title <br>
                <input  type="text" id="title" placeholder="Title"
                        value="${movie.title}">
                </div>
                <div class="field">
                Director <br>
                <input  type="text" id="director" placeholder="Director"
                        value="${movie.director}">
                </div>
                <div class="field">
                Thumbnail <br>
                <input  type="text" id="thumbnail" placeholder="Thumbnail URL"
                        value="${movie.thumbnail}">
                </div>
                <div class="actions">
                    <button class="update" data-my-id="${i}">
                        Update
                    </button>
                    <button class="index">
                        Back
                    </button>
               `;
        }


        const showView = (movie) => {
            // Complete: generate HTML with movie information
            return `
             <p>
                <strong>Title:</strong> ${movie.title} <br>
                <strong>Director:</strong> ${movie.director}
             </p>
             <div class="actions">
                <button class="index">Back</button>
             </div>`;
        }


        const newView = () => {
            // Complete: generate form to create new movie
            return `<h2>Create Movie</h2>
                <div class="field">
                Title <br>
                <input  type="text" id="title" placeholder="Title">
                </div>
                <div class="field">
                Director <br>
                <input  type="text" id="director" placeholder="Director">
                </div>
                <div class="field">
                Thumbnail <br>
                <input  type="text" id="thumbnail" placeholder="Thumbnail URL">
                </div>
                <div class="actions">
                    <button class="create">Create</button>
                    <button class="index">Back</button>
                </div>`;
        }


        // ----- NETFLIX 2.0: TMDb VIEWS -----

        // Search form. message: error or hint for the user, query: previous search term
        const searchView = (message, query) => {
            return `<h2>Search Movies on TMDb</h2>
                <div class="field">
                Movie title <br>
                <input  type="text" id="query" placeholder="e.g. Titanic" value="${query}">
                </div>
                <p class="message">${message}</p>
                <div class="actions">
                    <button class="search">Search</button>
                    <button class="index">Back</button>
                </div>`;
        }

        // Search results: poster, title, release date, synopsis, "Add" and "Keywords" buttons
        const resultsView = (results) => {
            let i = 0;
            let view = `<h2>Search Results</h2>
                <p class="status" id="status"></p>`;

            if (results.length === 0) {
                view += `<p class="message">No movies were found. Please try another title.</p>`;
            }

            while (i < results.length) {
                let poster = "files/noimage.png";
                if (results[i].poster_path) {
                    poster = TMDB_IMG_URL + results[i].poster_path;
                }
                view += `
                <div class="result">
                    <img src="${poster}" onerror="this.src='files/noimage.png'"/>
                    <h3>${results[i].title}</h3>
                    <p><strong>Release date:</strong> ${results[i].release_date || "unknown"}</p>
                    <p>${results[i].overview || "<em>No synopsis available</em>"}</p>
                    <div class="actions">
                        <button class="add-from-api" data-my-id="${i}">Add</button>
                        <button class="keywords" data-my-id="${results[i].id}">Keywords</button>
                    </div>
                </div>\n`;
                i = i + 1;
            }

            view += `<div class="actions">
                        <button class="open-search">New search</button>
                        <button class="index">Back</button>
                    </div>`;
            return view;
        }


        // ----- NETFLIX 3.0: KEYWORD VIEWS -----

        // Keywords of the selected movie, each with an "Add to my list" button
        // keywords: processed keywords (clean, lowercase, sorted), message: error message or ""
        const keywordsView = (movieId, keywords, title, message) => {
            let my_keywords = JSON.parse(localStorage.my_keywords);
            let i = 0;
            let view = `<h2>Keywords: ${title}</h2>
                <p class="status" id="status"></p>
                <p class="message">${message}</p>`;

            if (keywords.length === 0 && message === "") {
                view += `<p class="message">This movie has no keywords on TMDb.</p>`;
            }

            view += `<ul class="keyword-list">`;
            while (i < keywords.length) {
                let button = `<button class="add-keyword" data-keyword="${keywords[i]}">Add to my list</button>`;
                if (my_keywords.includes(keywords[i])) {
                    button = `<button class="add-keyword" disabled>In my list</button>`;
                }
                view += `<li>${keywords[i]} ${button}</li>\n`;
                i = i + 1;
            }
            view += `</ul>`;

            view += `<div class="actions">
                        <button class="back-results">Back to results</button>
                        <button class="my-keywords">My keywords</button>
                    </div>`;
            return view;
        }

        // Custom keyword list with a "Remove" button for each keyword
        const myKeywordsView = (my_keywords) => {
            let i = 0;
            let view = `<h2>My Keywords</h2>`;

            if (my_keywords.length === 0) {
                view += `<p class="message">Your list is empty. Search a movie on TMDb and add some keywords.</p>`;
            }

            view += `<ul class="keyword-list">`;
            while (i < my_keywords.length) {
                view += `<li>${my_keywords[i]} <button class="remove-keyword" data-my-id="${i}">Remove</button></li>\n`;
                i = i + 1;
            }
            view += `</ul>`;

            view += `<div class="actions">
                        <button class="index">Back</button>
                    </div>`;
            return view;
        }



        // CONTROLLERS
        const indexContr = () => {
         let my_movies = JSON.parse(localStorage.my_movies);
         document.getElementById('main').innerHTML = indexView(my_movies);
         };


        const showContr = (i) => {
            // Complete: controller that shows the showView(movie)
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = showView(movie);
        };

        const newContr = () => {
            // Complete: controller that shows the newView()
            document.getElementById('main').innerHTML = newView();
        };

        const createContr = () => {
            // Complete: controller that creates a new movie in the model saved in localStorage
            let title     = document.getElementById('title').value.trim();
            let director  = document.getElementById('director').value.trim();
            let thumbnail = document.getElementById('thumbnail').value.trim();

            // Validate user input: title and director are required
            if (title === "" || director === "") {
                alert("Please enter at least a title and a director.");
                return;
            }

            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies.push({ title: title, director: director, thumbnail: thumbnail });
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };

        const editContr = (i) => {
            let movie = JSON.parse(localStorage.my_movies)[i];
            document.getElementById('main').innerHTML = editView(i, movie);
        };


        const updateContr = (i) => {
            let my_movies = JSON.parse(localStorage.my_movies);
            my_movies[i].title    = document.getElementById('title').value;
            my_movies[i].director  = document.getElementById('director').value;
            my_movies[i].thumbnail = document.getElementById('thumbnail').value;
            localStorage.my_movies = JSON.stringify(my_movies);
            indexContr();
        };


        const deleteContr = (i) => {
            // Complete: controller that updates the model by deleting the selected movie
            // Generates confirmation dialog: Accept button returns true, Cancel false
            let my_movies = JSON.parse(localStorage.my_movies);
            if (confirm(`Do you really want to delete "${my_movies[i].title}"?`)) {
                my_movies.splice(i, 1);
                localStorage.my_movies = JSON.stringify(my_movies);
                indexContr();
            }
        };


        const resetContr = () => {
            // Complete: controller that resets the model saved in localStorage with the original movies
            localStorage.my_movies = JSON.stringify([...initial_movies]);
            indexContr();
        };


        // ----- NETFLIX 2.0: TMDb CONTROLLERS -----

        // GET request to the TMDb API (fetch with options, as in the task description)
        // Throws an Error with a clear message if something fails
        const tmdbGet = async (path) => {
            if (TMDB_TOKEN === "YOUR_API_READ_ACCESS_TOKEN") {
                throw new Error("No TMDb API token found. Please add your token to config.js.");
            }

            const options = {
                method: 'GET',
                headers: {
                    accept: 'application/json',
                    Authorization: 'Bearer ' + TMDB_TOKEN
                }
            };

            let response;
            try {
                response = await fetch(TMDB_API_URL + path, options);
            } catch (err) {
                // fetch is rejected if the request could not be sent (e.g. no internet connection)
                throw new Error("Could not connect to TMDb. Please check your internet connection.");
            }

            if (response.status === 401) {
                throw new Error("Invalid TMDb API token. Please check config.js.");
            }
            if (response.status !== 200) {
                throw new Error("TMDb request failed (HTTP " + response.status + ").");
            }

            return await response.json();
        };

        // Shows the empty search form
        const searchFormContr = () => {
            document.getElementById('main').innerHTML = searchView("", "");
        };

        // Validates the query, searches TMDb and shows the results
        const searchContr = async (query) => {
            query = query.trim();

            // Validation: not empty and no invalid characters
            if (query === "") {
                document.getElementById('main').innerHTML = searchView("Please enter a movie title.", query);
                return;
            }
            if (/[^a-zñáéíóúü0-9 .,:'!?-]/i.test(query)) {
                document.getElementById('main').innerHTML = searchView("The search term contains invalid characters.", "");
                return;
            }

            try {
                let response = await tmdbGet('/search/movie?query=' + query);
                search_results = response.results;
                document.getElementById('main').innerHTML = resultsView(search_results);
            } catch (err) {
                document.getElementById('main').innerHTML = searchView(err.message, query);
            }
        };

        // Adds a movie from the search results to the local database (localStorage)
        // Returns true if the movie was added, false otherwise
        const addFromAPIContr = async (movie) => {
            let status = document.getElementById('status');

            // Validate the data before adding
            if (!movie || !movie.title) {
                status.innerHTML = "This movie has no valid data and cannot be added.";
                return false;
            }

            try {
                // The search results do not include the director, so it is requested separately
                let credits = await tmdbGet('/movie/' + movie.id + '/credits');
                let directors = [];
                let j = 0;
                while (j < credits.crew.length) {
                    if (credits.crew[j].job === "Director") {
                        directors.push(credits.crew[j].name);
                    }
                    j = j + 1;
                }

                let new_movie = {
                    title:     movie.title,
                    director:  directors.join(", ") || "Unknown",
                    thumbnail: "files/noimage.png"
                };
                if (movie.poster_path) {
                    new_movie.thumbnail = TMDB_IMG_URL + movie.poster_path;
                }

                // Avoid duplicates: same title and same director
                let my_movies = JSON.parse(localStorage.my_movies);
                let i = 0;
                while (i < my_movies.length) {
                    if (my_movies[i].title.toLowerCase()    === new_movie.title.toLowerCase() &&
                        my_movies[i].director.toLowerCase() === new_movie.director.toLowerCase()) {
                        status.innerHTML = `"${new_movie.title}" is already in your movies.`;
                        return false;
                    }
                    i = i + 1;
                }

                my_movies.push(new_movie);
                localStorage.my_movies = JSON.stringify(my_movies);
                status.innerHTML = `"${new_movie.title}" was added to your movies.`;
                return true;
            } catch (err) {
                status.innerHTML = err.message;
                return false;
            }
        };


        // ----- NETFLIX 3.0: KEYWORD CONTROLLERS -----

        // Cleans one keyword with a regular expression (example from the task description)
        const cleanKeyword = (keyword) => {
            return keyword
                .replace(/[^a-zñáéíóú0-9 ]+/igm, "")  // Remove special characters
                .trim()                               // Remove leading and trailing spaces
                .toLowerCase();                       // Convert to lowercase
        };

        // Processes the keywords from the API: clean, lowercase, no duplicates, sorted
        // keywords: array of objects from TMDb, e.g. [{ id: 1, name: "Shipwreck" }, ...]
        const processKeywords = (keywords) => {
            let list = [];
            for (let keyword of keywords) {                 // iterator: goes through all keywords
                let clean = cleanKeyword(keyword.name);
                if (clean !== "" && !list.includes(clean)) { // skip empty words and duplicates
                    list.push(clean);
                }
            }
            return list.sort();                             // alphabetical order
        };

        // Requests the keywords of a movie from TMDb and shows them in the keywordsView
        const keywordsContr = async (movieId) => {
            // Look for the title of the movie in the search results
            let title = "";
            let i = 0;
            while (i < search_results.length) {
                if (search_results[i].id === movieId) {
                    title = search_results[i].title;
                }
                i = i + 1;
            }

            try {
                let response = await tmdbGet('/movie/' + movieId + '/keywords');
                let keywords = processKeywords(response.keywords);
                document.getElementById('main').innerHTML = keywordsView(movieId, keywords, title, "");
            } catch (err) {
                document.getElementById('main').innerHTML = keywordsView(movieId, [], title, err.message);
            }
        };

        // Shows the search results again (from the keywords view)
        const resultsContr = () => {
            document.getElementById('main').innerHTML = resultsView(search_results);
        };

        // Adds a keyword to the custom list in localStorage. Returns true if it was added
        const addKeywordToList = (keyword) => {
            let status = document.getElementById('status');
            let my_keywords = JSON.parse(localStorage.my_keywords);

            // Validate before saving: clean the keyword again with the regular expression
            keyword = cleanKeyword(keyword);
            if (keyword === "") {
                status.innerHTML = "This keyword is not valid.";
                return false;
            }

            if (my_keywords.includes(keyword)) {
                status.innerHTML = `"${keyword}" is already in your list.`;
                return false;
            }

            my_keywords.push(keyword);
            my_keywords.sort();                              // keep the list in alphabetical order
            localStorage.my_keywords = JSON.stringify(my_keywords);
            status.innerHTML = `"${keyword}" was added to your list.`;
            return true;
        };

        // Shows the custom keyword list
        const myKeywordsContr = () => {
            let my_keywords = JSON.parse(localStorage.my_keywords);
            document.getElementById('main').innerHTML = myKeywordsView(my_keywords);
        };

        // Removes a keyword from the custom list and shows the updated list
        const removeKeywordContr = (i) => {
            let my_keywords = JSON.parse(localStorage.my_keywords);
            my_keywords.splice(i, 1);
            localStorage.my_keywords = JSON.stringify(my_keywords);
            myKeywordsContr();
        };


        // EVENT ROUTER
        const matchEvent = (ev, sel) => ev.target.matches(sel);
        const myId = (ev) => Number(ev.target.dataset.myId);

        document.addEventListener('click', ev => {
            if      (matchEvent(ev, '.index'))  indexContr  ();
            else if (matchEvent(ev, '.edit'))   editContr   (myId(ev));
            else if (matchEvent(ev, '.update')) updateContr (myId(ev));
            // Complete by adding the missing controllers
            else if (matchEvent(ev, '.show'))   showContr   (myId(ev));
            else if (matchEvent(ev, '.new'))    newContr    ();
            else if (matchEvent(ev, '.create')) createContr ();
            else if (matchEvent(ev, '.delete')) deleteContr (myId(ev));
            else if (matchEvent(ev, '.reset'))  resetContr  ();
            // Netflix 2.0
            else if (matchEvent(ev, '.open-search')) searchFormContr ();
            else if (matchEvent(ev, '.search'))      searchContr (document.getElementById('query').value);
            else if (matchEvent(ev, '.add-from-api')) {
                let button = ev.target;
                button.disabled = true;                 // prevents pressing the button multiple times
                button.innerHTML = "Adding...";
                addFromAPIContr(search_results[myId(ev)]).then(added => {
                    if (added) {
                        button.innerHTML = "Added";      // stays disabled: the movie is already saved
                    } else {
                        button.innerHTML = "Add";
                        button.disabled = false;
                    }
                });
            }
            // Netflix 3.0
            else if (matchEvent(ev, '.keywords'))       keywordsContr      (myId(ev));
            else if (matchEvent(ev, '.back-results'))   resultsContr       ();
            else if (matchEvent(ev, '.my-keywords'))    myKeywordsContr    ();
            else if (matchEvent(ev, '.remove-keyword')) removeKeywordContr (myId(ev));
            else if (matchEvent(ev, '.add-keyword')) {
                let button = ev.target;
                if (addKeywordToList(button.dataset.keyword)) {
                    button.innerHTML = "In my list";
                    button.disabled = true;
                }
            }
        })

        // Netflix 2.0: the Enter key in the search field also starts the search
        document.addEventListener('keydown', ev => {
            if (ev.key === 'Enter' && matchEvent(ev, '#query')) searchContr (ev.target.value);
        })



        // Initialization
        document.addEventListener('DOMContentLoaded', indexContr);
    </script>
</head>

<body>

    <h1>My Favourite Movies</h1>
    <div id="main"> <!-- The view is included here --> </div>


</body>
</html>
